<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Code スターター</title>
  <script src="https://unpkg.com/ryuu.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header class="brand-header">
      <div class="brand-identity">
        <h1 class="brand-name" id="brandName">会社名</h1>
        <span class="brand-tagline" id="brandTagline">Pro Code スターターアプリ</span>
      </div>
      <div class="app-title">
        <h2 class="app-name">データセット閲覧</h2>
      </div>
    </header>

    <section class="stats-bar" id="statsBar">
      <div class="stat">
        <div class="stat-number" id="rowCount">—</div>
        <div class="stat-label">行数</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="columnCount">—</div>
        <div class="stat-label">列数</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="userName">—</div>
        <div class="stat-label">ログインユーザー</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="instanceName">—</div>
        <div class="stat-label">インスタンス</div>
      </div>
    </section>

    <main class="content-grid">

      <section class="card" id="tableCard">
        <div class="card-header">データプレビュー</div>
        <div class="card-content scrollable">
          <table id="dataTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <aside class="card" id="actionsCard">
        <div class="card-header">操作</div>
        <div class="card-content">
          <button class="btn primary" id="refreshBtn">データを再取得</button>
          <button class="btn secondary" id="runSqlBtn">SQL を実行</button>
          <div class="action-hint">
            このスケルトンの manifest の <code>dataSetId</code> を自分のデータセット UUID に差し替え、
            その上に AI エージェントで必要なワークフローを構築してください。
          </div>
        </div>
      </aside>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
